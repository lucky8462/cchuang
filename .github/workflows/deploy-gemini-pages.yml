name: Deploy Gemini web app to GitHub Pages

on:
  push:
    branches: [claude/image-ocr-to-word-z82aqf]
    paths: [serverless-gemini/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: serverless-gemini
      - id: deployment
        uses: actions/deploy-pages@v4
